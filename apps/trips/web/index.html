<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trips · Destination Helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui-kit/tokens.css">
<link rel="stylesheet" href="/ui-kit/shell.css">
<link rel="stylesheet" href="/ui-kit/app.css">
<style>
/* ---- the trip hero: name, dates, health, the stage stepper */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px 24px;align-items:center;background:var(--night);color:#fff;border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;box-shadow:var(--shadow-md);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(228,100,59,.45),transparent 65%);pointer-events:none}
.hero h1{font-size:30px;margin:0 0 4px;color:#fff}
.hero .meta{font-size:13.5px;color:rgba(255,255,255,.72)}
.hero .meta b{color:#fff;font-weight:600}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero .acts .sbtn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff}
.hero .acts .sbtn.gold{background:var(--gold);border-color:var(--gold)}
.health{display:grid;place-items:center;width:104px;height:104px;border-radius:50%;background:conic-gradient(var(--h-col) calc(var(--h) * 1%),rgba(255,255,255,.12) 0);position:relative;flex:none}
.health::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--night)}
.health b{position:relative;z-index:1;font-family:var(--font-heading);font-size:30px;line-height:1}
.health small{position:relative;z-index:1;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.stepper{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.stepper button{font:inherit;font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:var(--radius-pill);border:1px solid rgba(255,255,255,.22);background:transparent;color:rgba(255,255,255,.75);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.stepper button i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);display:inline-block}
.stepper button.done{color:#fff;border-color:transparent;background:rgba(255,255,255,.1)}.stepper button.done i{background:var(--ok)}
.stepper button.on{background:var(--gold);border-color:var(--gold);color:#fff}.stepper button.on i{background:#fff}
.stepper .arrow{color:rgba(255,255,255,.35);font-size:12px}
/* ---- the journey timeline */
.chapters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px}
.chapters::-webkit-scrollbar{display:none}
.chapters a{flex:none;text-decoration:none;color:var(--paper);font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:var(--radius-pill);background:var(--ink-3);border:1px solid var(--line)}
.chapters a small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.journey{position:relative;padding-left:34px}
.journey::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--sea),var(--gold));border-radius:2px;opacity:.55}
.stop{position:relative;margin-bottom:22px;scroll-margin-top:130px}
.stop .dot{position:absolute;left:-30px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--ink-3);border:3px solid var(--sea);box-shadow:0 0 0 3px var(--ink)}
.stop.today .dot{border-color:var(--gold);box-shadow:0 0 0 3px var(--ink),0 0 0 7px var(--gold-soft)}
.stop.nostay .dot{border-style:dashed;border-color:var(--warn)}
.stop-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.stop-head .dayname{font-family:var(--font-heading);font-size:20px}
.stop-head .dayname small{font-family:var(--font-body);font-size:12.5px;color:var(--mut);margin-left:8px;font-weight:500}
.stop-head .night{font-size:12.5px;color:var(--mut);white-space:nowrap}
.stop-head .night.warn{color:var(--warn);font-weight:600}
.it{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding:12px 14px;background:var(--ink-3);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;align-items:center;box-shadow:var(--shadow-sm);border-left-width:4px}
.it:hover{border-color:var(--sea);box-shadow:var(--shadow-md)}
.it.flag-blocker{border-left-color:var(--bad)}.it.flag-warn{border-left-color:var(--warn)}.it.flag-none{border-left-color:var(--sea)}.it.is-stay{border-left-color:var(--night)}
.it .glyph{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--sea-soft)}
.it.is-stay .glyph{background:var(--ink-2)}
.it .ti{font-weight:600;font-size:15px;line-height:1.25}
.it .su{font-size:12.5px;color:var(--mut);margin-top:2px}
.it .tm{font-size:12.5px;color:var(--paper-2);font-variant-numeric:tabular-nums;font-weight:600}
.it .pr{text-align:right;font-family:var(--font-heading);font-size:18px;white-space:nowrap}
.it .pr small{display:block;font-family:var(--font-body);font-size:11px;color:var(--mut);font-weight:400}
.it.empty{cursor:default;background:transparent;box-shadow:none;border-style:dashed;color:var(--mut);grid-template-columns:1fr;font-size:13px;padding:10px 14px;border-left-width:1px}
.st{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:var(--radius-pill);margin-left:6px;vertical-align:middle;background:var(--ink-2);color:var(--mut)}
.st.booked,.st.confirmed,.st.done{background:var(--ok-soft);color:var(--ok)}.st.check_now{background:var(--warn-soft);color:var(--warn)}.st.cancelled{text-decoration:line-through}
.leave{font-size:12px;color:var(--gold);font-weight:600}
/* ---- checks */
.fd{border-left:4px solid var(--line-2);padding:12px 14px;margin-bottom:8px;background:var(--ink-3);border-radius:12px;box-shadow:var(--shadow-sm)}
.fd.blocker{border-left-color:var(--bad)}.fd.warn{border-left-color:var(--warn)}.fd.info{border-left-color:var(--sea)}
.fd .fx{color:var(--paper-2);font-size:13px;margin-top:3px}.fd .rl{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mut)}
.links a{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;padding:6px 12px;border:1px solid var(--line);border-radius:var(--radius-pill);margin:0 6px 8px 0;text-decoration:none;color:var(--paper);background:var(--ink-3)}
.links a:hover{border-color:var(--gold);color:var(--gold)}
/* ---- run: the next move */
.next{background:linear-gradient(135deg,var(--sea),#0f5561);color:#fff;border-radius:var(--radius);padding:20px 22px;margin-bottom:14px;box-shadow:var(--shadow-md)}
.next .lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:700}
.next h3{font-size:26px;color:#fff;margin:6px 0 2px;font-family:var(--font-heading)}
.next .when{font-size:15px;color:rgba(255,255,255,.85)}
.next .code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:rgba(255,255,255,.14);padding:3px 8px;border-radius:6px}
.next .links a{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}
/* ---- tasks, helper, misc */
.tk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.tk:first-child{border-top:0}.tk.done{opacity:.5}.tk .due{font-size:12px;color:var(--mut);white-space:nowrap;margin-left:auto}
.q{padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}.q code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--sea);margin-right:8px;font-weight:600}
.wf{border:1px solid var(--line);background:var(--ink-3);padding:14px 16px;margin-bottom:8px;border-radius:12px}.wf h4{margin:0 0 4px;font-size:17px}
.wf ol{margin:6px 0 4px 18px;padding:0;font-size:13.5px}.wf .tr{font-size:12.5px;color:var(--mut)}
.msg{white-space:pre-wrap;font-size:13.5px;background:var(--ink-2);border-radius:10px;padding:10px 12px}
/* ---- the wizard */
.wiz .steps{display:flex;gap:6px;margin:4px 0 14px}.wiz .steps i{flex:1;height:4px;border-radius:2px;background:var(--ink-2)}.wiz .steps i.on{background:var(--gold)}
.wiz .q1{font-family:var(--font-heading);font-size:24px;margin:0 0 4px}
.wiz .why{font-size:13px;color:var(--mut);margin-bottom:12px}
.wiz .opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line-2);border-radius:12px;margin-bottom:8px;cursor:pointer}
.wiz .opt:has(input:checked){border-color:var(--gold);background:var(--gold-soft)}
.wiz .opt input{margin-top:3px;accent-color:var(--gold)}
.wiz .opt b{display:block;font-weight:600}.wiz .opt span{font-size:12.5px;color:var(--mut)}
.wiz .nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
@media (max-width:760px){
 .hero{grid-template-columns:1fr;padding:18px 16px}.hero h1{font-size:24px}.health{width:84px;height:84px;justify-self:start}.health b{font-size:24px}
 .it{grid-template-columns:38px 1fr;gap:10px;padding:10px 12px}.it .glyph{width:38px;height:38px;font-size:17px}.it .pr{grid-column:2;text-align:left;font-size:16px}
 .journey{padding-left:26px}.stop .dot{left:-23px;width:14px;height:14px}.journey::before{left:8px}
}
</style>
</head>
<body>
<header class="band"><div class="appbar">
 <span class="appbar-brand"><span class="appbar-eyebrow">Destination Helper</span>Trips</span>
 <span class="appbar-right"><span class="pill" id="pill"></span><a href="/apps/destinations/web/">Destinations</a><a href="/apps/launcher/web/">Home</a></span>
</div></header>
<main class="wrap">
 <div class="side-layout">
  <aside class="sidebar">
   <div><h4>Trips</h4><div class="opts" id="trips"></div><button class="sbtn mini gold" id="new-trip">+ New trip</button></div>
   <div><nav class="sidenav" id="tabs"><a href="#timeline" class="on">Timeline</a><a href="#checks">Checks</a><a href="#costs">Costs</a><a href="#prepare">Prepare</a><a href="#run">Run</a><a href="#confirm">Confirm</a><a href="#helper">Guide</a><a href="#region">Local tips</a></nav></div>
  </aside>
  <div class="content">
   <div id="hero"></div>
   <section class="panel on" id="p-timeline"></section>
   <section class="panel" id="p-checks"></section>
   <section class="panel" id="p-costs"></section>
   <section class="panel" id="p-prepare"></section>
   <section class="panel" id="p-run"></section>
   <section class="panel" id="p-confirm"></section>
   <section class="panel" id="p-helper"></section>
   <section class="panel" id="p-region"></section>
  </div>
 </div>
</main>
<dialog class="form-dialog" id="form"></dialog>
<script src="/ui-kit/app.js"></script>
<script src="trips.js"></script>
<script src="/ui-kit/tour.js"></script>
<script>
Tour.init({ page: 'trips', steps: [
  { title: 'Trips: the Destination Helper', text: 'A trip co-pilot. It plans the trip, then helps you run it: <b>Plan</b> (routes, timing, costs and the checks), <b>Prepare</b> (confirm bookings, the before-you-go list, deadlines), <b>Run</b> (the day\'s legs with leave-by times and live links). Work and personal, any size.' },
  { target: '#new-trip', title: 'Five questions to start', text: 'New trip asks who\'s going, where and when (or not sure yet), the budget and what matters, what\'s already booked, and how much the app should handle. Everything else is asked only when a step needs it.' },
  { target: '#hero', title: 'The trip, and its health', text: 'The health score starts at 100 and drops for every open problem the checker finds. Move the trip along the stages as you go.' },
  { target: '#tabs a[href="#timeline"]', title: 'The journey', text: 'One line through the whole trip: a stop per day, the night\'s stay on each, every leg, stay and activity as a card with its mode. A red edge means something on it would cost money or a missed ride; amber, worth a look. Click a card for the live links and the details.' },
  { target: '#tabs a[href="#checks"]', title: 'Checks', text: 'The part other planners skip. Pickups booked before the flight lands, prices that don\'t say per person or group, nights with no stay, tight connections, the last ferry, budget caps, passport validity, deadlines.' },
  { target: '#tabs a[href="#run"]', title: 'Travel day', text: 'Only the next move: what it is, when to leave, the confirmation code, the live links. Then the rest of the day.' },
  { target: '#tabs a[href="#confirm"]', title: 'Confirm', text: 'W27: message the business first (WhatsApp, LINE, text, email), call only if there is no reply, and the call says it\'s automated. The engine drafts; you send and log the answer.' },
  { target: '#tabs a[href="#helper"]', title: 'The guide', text: 'The capability list itself: question codes, workflows with their steps, guardrails with why each exists, the brief, and this trip\'s track record.' },
]});
</script>
</body>
</html>
