<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Destination Helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui-kit/tokens.css">
<link rel="stylesheet" href="/ui-kit/shell.css">
<link rel="stylesheet" href="/ui-kit/app.css">
<style>
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:10px 0 22px;flex-wrap:wrap}
.top h1{font-size:46px;margin:0 0 4px}
.top .sub{font-size:15px;color:var(--mut)}
.tripcard{display:grid;grid-template-columns:72px 88px 1fr auto;gap:18px;align-items:center;background:var(--color-surface);border-radius:var(--radius);padding:22px 26px;margin-bottom:12px;text-decoration:none;color:inherit}
.tripcard:hover{background:var(--color-neutral-200)}
.days{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--color-accent-2-200);color:var(--color-accent-2-900);text-align:center;line-height:1}
.days.near{background:var(--color-accent-2-800);color:var(--color-bg)}
.days b{font-family:var(--font-heading);font-size:24px;display:block}.days small{font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.tripcard .ph{width:88px;height:88px}
.tripcard h2{font-size:30px;margin:0 0 4px;line-height:1.05}
.tripcard .meta{font-size:14px;color:var(--mut)}
.tripcard .chips{margin:10px 0 0;gap:6px}
.tripcard .chips span{font-size:12px;padding:4px 12px;border-radius:var(--radius-pill);background:var(--color-neutral-100);color:var(--paper)}
.tripcard .chips span.fix{background:var(--color-accent);color:var(--color-bg)}.tripcard .chips span.warn{background:var(--color-accent-100);color:var(--color-accent-800)}.tripcard .chips span.ok{background:var(--color-accent-2-100);color:var(--color-accent-2-800)}
.tripcard .side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.tripcard .stage{font-size:12px;padding:4px 12px;border-radius:var(--radius-pill);background:var(--color-neutral-100)}
.tripcard .health{font-family:var(--font-heading);font-size:24px;line-height:1}.tripcard .health small{font-family:var(--font-body);font-size:11px;color:var(--mut);margin-left:4px}
.past{margin-top:34px}.past h3{font-size:22px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.past .row-p{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:14px;text-decoration:none;color:inherit}
.past .row-p:hover b{color:var(--color-accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:8px}
.app{background:var(--color-surface);padding:18px 20px;text-decoration:none;color:inherit;display:block;border-radius:var(--radius)}
.app h2{font-size:22px;color:var(--paper)}
.app p{margin:4px 0 0;color:var(--mut);font-size:13px}
.app .st{display:inline-block;margin-top:10px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent);font-weight:600}
a.app:hover{background:var(--color-neutral-200)}
.spark{width:100%;height:44px;display:block}
.run{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.run:first-child{border-top:0}
.lead{color:var(--paper-2);max-width:720px;margin:0 0 14px}
@media (max-width:760px){.top h1{font-size:36px}.tripcard{grid-template-columns:56px 1fr;gap:12px;padding:16px}.days{width:56px;height:56px}.days b{font-size:19px}.tripcard .ph{display:none}.tripcard h2{font-size:24px}.tripcard .side{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}}
</style>
</head>
<body>
<header class="band"><div class="appbar">
 <span class="appbar-brand"><span class="appbar-eyebrow">Destination Helper</span>Home</span>
 <span class="appbar-right"><span class="pill dev-only" id="health">engine <b>…</b></span><a href="/apps/trips/web/">Trips</a><a href="/apps/destinations/web/">Destinations</a><a href="/apps/system/web/browse.html" data-user-label="History" data-dev-label="Browse">History</a></span>
</div></header>
<main class="wrap">
 <div class="side-layout">
  <aside class="sidebar dev-only">
   <div><h4>Home</h4><nav class="sidenav" id="tabs"><a href="#today" class="on">Your trips</a><a href="#tracking" class="dev-only">Tracking</a><a href="#workflows" class="dev-only">Workflows</a><a href="#apps">Apps</a></nav></div>
  </aside>
  <div class="content">
   <section class="panel on" id="p-today"></section>
   <section class="panel" id="p-tracking"></section>
   <section class="panel" id="p-workflows"></section>
   <section class="panel" id="p-apps"></section>
  </div>
 </div>
</main>
<script src="/ui-kit/app.js"></script>
<script src="home.js"></script>
<script src="/ui-kit/helper.js"></script>
<script src="/ui-kit/tour.js"></script>
<script>
Tour.init({ page: 'home', steps: [
  { title: 'Destination Helper', text: 'A trip co-pilot: it plans the trip, checks the plan for the mistakes that cost money, helps you get ready, then runs the trip with you. Work and personal, any size.' },
  { target: '#trips-now', title: 'Your trips', text: 'Each trip with the days to go, what needs fixing, what is still to book, and its health. Tap one to open it.' },
  { target: '#new-trip', title: 'Five questions to start', text: 'New trip asks who\'s going, where and when (or not sure yet), your budget, what\'s already booked, and how much help you want.' },
  { target: '#helper-fab', title: 'Ask the helper', text: 'Ask about any trip in your own words. It answers from your plan, the checks and the local tips, and suggests. Nothing is added to a trip until you say so.' },
  { target: '#mode-switch', title: 'User and Developer', text: 'User mode is the app as a traveller sees it. Developer mode shows the engine behind it.' },
]});
</script>
</body>
</html>
