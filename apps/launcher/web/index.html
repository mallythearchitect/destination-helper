<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Destination Helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui-kit/tokens.css">
<link rel="stylesheet" href="/ui-kit/shell.css">
<link rel="stylesheet" href="/ui-kit/app.css">
<style>
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:8px}
.app{border:1px solid var(--line);background:var(--ink-3);padding:12px 14px;text-decoration:none;color:inherit;display:block}
.app h2{font-size:19px;color:var(--paper)}
.app p{margin:4px 0 0;color:var(--mut);font-size:12.5px}
.app .st{display:inline-block;margin-top:8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
a.app:hover{border-color:var(--gold)}
.spark{width:100%;height:44px;display:block}
.run{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.run:first-child{border-top:0}
.lead{color:var(--paper-2);max-width:720px;margin:0 0 14px}
.trip{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center;text-decoration:none;color:inherit}
.trip:first-child{border-top:0}.trip:hover b{color:var(--gold)}
.trip .sub{font-size:12.5px;color:var(--mut)}
</style>
</head>
<body>
<header class="band"><div class="appbar">
 <span class="appbar-brand"><span class="appbar-eyebrow">Destination Helper</span>Home</span>
 <span class="appbar-right"><span class="pill" id="health">engine <b>…</b></span></span>
</div></header>
<main class="wrap">
 <div class="side-layout">
  <aside class="sidebar">
   <div><h4>Home</h4><nav class="sidenav" id="tabs"><a href="#today" class="on">Overview</a><a href="#tracking">Tracking</a><a href="#workflows">Workflows</a><a href="#apps">Apps</a></nav></div>
   <div><h4>What it does</h4><div class="opts"><button class="sub" disabled>plans the trip</button><button class="sub" disabled>checks the plan</button><button class="sub" disabled>prepares you</button><button class="sub" disabled>runs it live</button></div></div>
  </aside>
  <div class="content">
   <section class="panel on" id="p-today"></section>
   <section class="panel" id="p-tracking"></section>
   <section class="panel" id="p-workflows"></section>
   <section class="panel" id="p-apps"></section>
  </div>
 </div>
</main>
<script src="/ui-kit/app.js"></script>
<script src="home.js"></script>
<script src="/ui-kit/tour.js"></script>
<script>
Tour.init({ page: 'home', steps: [
  { title: 'Destination Helper', text: 'A trip co-pilot: it plans the trip, checks the plan for the mistakes that cost money, helps you prepare, then runs the trip live. Work and personal, any size. Everything lives in one file on this computer.' },
  { target: '#trips-now', title: 'Your trips', text: 'Each trip with its stage, what is still to book, and what the checker has open. Click one to open it.' },
  { target: '#tabs a[href="#workflows"]', title: 'What the engine does on its own', text: 'Every morning it re-checks every trip, writes the day\'s numbers, and forecasts them. Runs are listed; any of them can be run now.' },
  { target: '#tabs a[href="#apps"]', title: 'The apps', text: 'Trips is the co-pilot. Destinations is the atlas of places with scores and costs. Browse holds every record; Settings holds every key and every rule.' },
  { target: '#tour-go', title: 'Go anywhere', text: '<b>Go to</b> jumps to any page from any page; <b>? Tour</b> replays a page\'s tour.' },
]});
</script>
</body>
</html>
